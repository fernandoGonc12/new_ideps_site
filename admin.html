<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do site — IDEPS</title>
<link rel="icon" href="ideps-icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* paleta extraída da logo do IDEPS */
  --papel:#F4F5FA; --branco:#FFF;
  --folha:#120A8B; --mata:#3A32A6; --mata-claro:#EAE9F6;
  --ipe:#D4007A; --ipe-claro:#FDE4F1;
  --amarelo:#F98A00; --amarelo-claro:#FFF1DC;
  --verde:#00C000; --agua:#00C87A; --laranja:#F98A00; --vermelho:#EE0000; --magenta:#F5008C;
  --linha:#DFE0EC; --texto:#161540; --texto-2:#585780;
  --display:'Bricolage Grotesque',sans-serif;
  --corpo:'Public Sans',system-ui,sans-serif;
  --dado:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--papel);color:var(--texto);font-family:var(--corpo);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--ipe);outline-offset:2px;border-radius:3px}
h1{font-family:var(--display);font-size:1.85rem;letter-spacing:-.02em;line-height:1.15}
h2{font-family:var(--display);font-size:1.15rem;font-weight:700;letter-spacing:-.01em}

.faixa{display:flex;height:5px}
.faixa i{flex:1}
.app{display:grid;grid-template-columns:252px 1fr;min-height:calc(100vh - 5px)}

/* ---------- lateral ---------- */
aside{background:var(--folha);color:#C6C3EC;padding:24px 16px;display:flex;flex-direction:column;gap:26px}
.logo{display:flex;flex-direction:column;align-items:flex-start;gap:9px;padding:0 8px 6px}
/* o wordmark tem letras no mesmo azul do fundo: precisa de placa clara atrás */
.placa{background:var(--branco);border-radius:10px;padding:8px 11px;display:inline-flex}
.logo img{height:28px;display:block}
.logo b{font-family:var(--display);color:#fff;font-size:1.15rem;letter-spacing:-.02em}
.logo small{display:block;font-family:var(--dado);font-size:.62rem;letter-spacing:.11em;
  text-transform:uppercase;color:#948DD6;font-weight:400}
.grupo-titulo{font-family:var(--dado);font-size:.63rem;letter-spacing:.13em;text-transform:uppercase;
  color:#6D66C4;padding:0 10px;margin-bottom:8px}
aside nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;
  font-size:.94rem;font-weight:500;margin-bottom:2px;transition:background .12s}
aside nav a:hover{background:#2A2296;color:#fff}
aside nav a.ativo{background:var(--ipe);color:#fff}
aside nav a .conta{margin-left:auto;font-family:var(--dado);font-size:.72rem;opacity:.7}
.usuario{margin-top:auto;border-top:1px solid #3A32A6;padding-top:18px;display:flex;align-items:center;gap:11px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--mata);color:#fff;font-weight:700;
  display:grid;place-items:center;flex-shrink:0}
.usuario small{display:block;font-size:.76rem;color:#948DD6}

/* ---------- área principal ---------- */
main{padding:34px 40px 64px;overflow-x:auto}
.topo{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:30px;flex-wrap:wrap}
.topo p{color:var(--texto-2);margin-top:6px;max-width:62ch}
.btn{background:var(--ipe);color:#fff;padding:11px 19px;border-radius:99px;font-weight:700;font-size:.92rem;
  display:inline-flex;align-items:center;gap:8px;transition:background .12s}
.btn:hover{background:#AB0062}
.btn.linha{background:transparent;color:var(--folha);box-shadow:inset 0 0 0 1.5px var(--linha)}
.btn.linha:hover{background:var(--branco);box-shadow:inset 0 0 0 1.5px var(--folha)}
.btn.fantasma{background:transparent;color:var(--texto-2);padding:9px 12px}
.btn.fantasma:hover{background:var(--mata-claro);color:var(--folha)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- cartões e tabelas ---------- */
.painel{background:var(--branco);border:1px solid var(--linha);border-radius:14px;overflow:hidden}
.painel-cabeca{padding:18px 22px;border-bottom:1px solid var(--linha);display:flex;
  justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-family:var(--dado);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--texto-2);font-weight:500;padding:13px 22px;border-bottom:1px solid var(--linha)}
td{padding:15px 22px;border-bottom:1px solid var(--linha);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FAFBF9}
.item{display:flex;align-items:center;gap:13px}
.miniatura{width:42px;height:42px;border-radius:9px;background:var(--mata-claro);object-fit:contain;
  padding:4px;flex-shrink:0}
.item b{display:block;font-weight:500}
.item small{color:var(--texto-2);font-family:var(--dado);font-size:.74rem}
.selo{font-family:var(--dado);font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;
  padding:4px 9px;border-radius:5px;font-weight:500;white-space:nowrap}
.selo.publicado{background:var(--mata-claro);color:var(--folha)}
.selo.rascunho{background:var(--amarelo-claro);color:#8A4C00}
.selo.ativo{background:var(--ipe-claro);color:#A00060}
.selo.encerrado{background:#ECECF2;color:var(--texto-2)}
/* continua célula de tabela: com display:flex a borda da linha saía desalinhada */
.acoes{text-align:right;white-space:nowrap}

/* ---------- resumo ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:30px}
.card{background:var(--branco);border:1px solid var(--linha);border-radius:14px;padding:20px}
.card strong{display:block;font-family:var(--display);font-size:2.1rem;line-height:1;letter-spacing:-.03em}
.card span{font-family:var(--dado);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--texto-2);display:block;margin-top:9px}
.card.alerta{border-color:var(--amarelo);background:var(--amarelo-claro)}
.card.alerta strong{color:#8A4C00}

/* ---------- formulário ---------- */
.form{display:grid;grid-template-columns:1fr 320px;gap:26px;align-items:start}
.campo{margin-bottom:20px}
label{display:block;font-weight:500;font-size:.9rem;margin-bottom:6px}
label small{display:block;font-weight:400;color:var(--texto-2);font-size:.82rem;margin-top:2px}
input[type=text],input[type=date],input[type=email],input[type=url],input[type=number],
input[type=password],select,textarea{
  width:100%;padding:11px 13px;border:1.5px solid var(--linha);border-radius:9px;
  background:var(--branco);font-size:.95rem}
input:focus,select:focus,textarea:focus{border-color:var(--mata);outline:none}
textarea{min-height:120px;resize:vertical;line-height:1.6}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.caixa{background:var(--branco);border:1px solid var(--linha);border-radius:14px;padding:22px}
.caixa h2{margin-bottom:16px}
.dica{background:var(--mata-claro);border-radius:10px;padding:14px 16px;font-size:.87rem;
  color:var(--folha);margin-top:18px}
.dica b{display:block;margin-bottom:4px}
.contador{font-family:var(--dado);font-size:.74rem;color:var(--texto-2);text-align:right;margin-top:5px}
.repetidor{border:1.5px dashed var(--linha);border-radius:10px;padding:14px;margin-bottom:10px;
  display:flex;gap:10px;align-items:center}
.repetidor input{flex:1;border:none;padding:4px 0}
.repetidor select{flex:0 0 auto;border:none;background:var(--mata-claro);
  border-radius:7px;padding:6px 8px;font-size:.84rem;width:auto}
.repetidor input:disabled{background:transparent;color:var(--texto-2)}
.rodape-form{display:flex;gap:10px;justify-content:flex-end;margin-top:26px;
  border-top:1px solid var(--linha);padding-top:22px}
.upload{border:1.5px dashed var(--linha);border-radius:12px;padding:28px;text-align:center;
  color:var(--texto-2);font-size:.9rem;background:#FAFBF9}
.upload b{display:block;color:var(--folha);margin-bottom:4px}

/* ---------- mídia ---------- */
.midia{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.midia figure{background:var(--branco);border:1px solid var(--linha);border-radius:12px;overflow:hidden}
.midia img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--mata-claro)}
.midia figcaption{padding:9px 11px;font-family:var(--dado);font-size:.7rem;color:var(--texto-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.figura-acoes{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:0 6px 8px;min-height:38px}
.figura-acoes .btn{padding:6px 9px;font-size:.8rem}
.figura-acoes .selo{margin-left:5px}
.carrossel-foto{width:64px;height:80px;object-fit:cover;border-radius:8px;flex-shrink:0;background:var(--mata-claro)}

/* ---------- prévia do banner de aviso: imita o que o site desenha ---------- */
.aviso-previa{border-radius:14px;padding:16px 18px 16px 22px;display:flex;gap:14px;align-items:flex-start}
.aviso-previa img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#fff}
.aviso-previa-tipo{font-family:var(--dado);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;
  font-weight:500;margin-bottom:3px}
.aviso-previa b{display:block;font-family:var(--display);font-size:1.05rem;color:var(--folha);line-height:1.25}
.aviso-previa p{font-size:.85rem;color:var(--texto-2);margin-top:5px;line-height:1.45}
.aviso-previa-botao{display:inline-block;margin-top:10px;color:#fff;font-weight:700;font-size:.8rem;
  padding:6px 13px;border-radius:99px}
.ponto-tipo{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:9px;vertical-align:-1px}

/* ---------- páginas e equipe ---------- */
.indice{display:block;width:100%;text-align:left;padding:7px 10px;font-size:.88rem;font-weight:500}
.atividade-textos{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.passos{margin:12px 0 14px 20px;color:var(--texto-2);font-size:.92rem}
.passos li{margin-bottom:8px}
.passos b{color:var(--texto)}

.vazio{padding:56px 22px;text-align:center;color:var(--texto-2)}
.vazio b{display:block;font-family:var(--display);font-size:1.15rem;color:var(--folha);margin-bottom:6px}

/* o atributo hidden precisa vencer o display:grid/flex dos blocos */
[hidden]{display:none!important}

/* ---------- tela de entrada ---------- */
.portao{position:fixed;inset:0;z-index:300;display:grid;place-items:center;
  background:var(--folha);padding:24px}
.portao-caixa{background:var(--branco);border-radius:16px;padding:34px;width:100%;max-width:400px;
  box-shadow:0 18px 50px rgba(0,0,0,.3)}
.portao-caixa img{height:30px;margin-bottom:22px}
.portao-caixa h1{font-size:1.5rem;margin-bottom:6px}
.portao-caixa p.abre{color:var(--texto-2);margin-bottom:22px;font-size:.92rem}
.portao-caixa .btn{width:100%;justify-content:center;margin-top:6px}
.erro{background:#FDE8E8;color:#A00000;border-radius:8px;padding:10px 13px;font-size:.86rem;margin-bottom:14px}
.sair{font-family:var(--dado);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;
  color:#948DD6;margin-left:auto;padding:6px 9px;border-radius:7px}
.sair:hover{background:#2A2296;color:#fff}

/* ---------- avisos do painel ---------- */
.maquete{background:var(--amarelo-claro);color:#8A4C00;border:1px solid var(--amarelo);
  border-radius:10px;padding:12px 16px;font-size:.88rem;margin-bottom:22px}
.maquete b{font-weight:700}

/* ---------- retorno de ação ---------- */
.recado{position:fixed;right:24px;bottom:24px;z-index:400;max-width:380px;
  background:var(--folha);color:#fff;padding:13px 18px;border-radius:10px;font-size:.9rem;
  box-shadow:0 8px 26px rgba(0,0,0,.24)}
.recado.ruim{background:#B00020}
.contador.estourou{color:#B00020;font-weight:700}

@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  aside{flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px;padding:14px}
  aside nav{display:flex;gap:4px;flex-wrap:wrap}
  .grupo-titulo,.usuario{display:none}
  .form{grid-template-columns:1fr}
  main{padding:24px 20px 48px}
}
</style>
</head>
<body>

<div class="portao" id="portao" hidden>
  <form class="portao-caixa" id="formLogin">
    <img src="ideps-wordmark.png" alt="IDEPS">
    <h1>Painel do site</h1>
    <p class="abre" id="portaoTexto">Entre com seu e-mail e senha para editar os projetos.</p>
    <p class="erro" id="erroLogin" hidden></p>
    <div id="camposLogin">
      <div class="campo"><label for="email">E-mail</label>
        <input id="email" type="text" autocomplete="username" required></div>
      <div class="campo"><label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit" id="btnEntrar">Entrar</button>
    </div>
  </form>
</div>

<div class="faixa"><i style="background:var(--vermelho)"></i><i style="background:var(--magenta)"></i><i style="background:var(--folha)"></i><i style="background:var(--agua)"></i><i style="background:var(--verde)"></i><i style="background:#F7E600"></i><i style="background:var(--laranja)"></i></div>
<div class="app" id="app-grade" hidden>
<aside>
  <div class="logo">
    <span class="placa"><img src="ideps-wordmark.png" alt="IDEPS"></span>
    <small>Painel do site</small>
  </div>
  <div>
    <p class="grupo-titulo">Conteúdo</p>
    <nav id="nav">
      <a href="#/">Resumo</a>
      <a href="#/projetos">Projetos <span class="conta" id="contaProjetos"></span></a>
      <a href="#/avisos">Avisos e novidades <span class="conta" id="contaAvisos"></span></a>
      <a href="#/paginas">Páginas</a>
      <a href="#/numeros">Números do topo</a>
      <a href="#/midia">Fotos e arquivos</a>
    </nav>
  </div>
  <div>
    <p class="grupo-titulo">Configurações</p>
    <nav id="nav2">
      <a href="#/contato">Contato e rodapé</a>
      <a href="#/equipe">Quem tem acesso</a>
    </nav>
  </div>
  <div class="usuario">
    <div class="avatar" id="avatar">··</div>
    <div><b style="font-size:.9rem;color:#fff" id="usuarioNome">—</b><small id="usuarioEmail"></small></div>
    <button class="sair" id="btnSair">Sair</button>
  </div>
</aside>

<main id="app"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- números, contato, fotos e textos padrão — o mesmo arquivo que o site lê -->
<script src="dados/padroes.js?v=2"></script>

<script>
/* ============================================================
   Painel do IDEPS
   Todas as telas gravam no Supabase e o site lê de lá. Os textos e
   valores padrão ficam em dados/padroes.js, que o site também carrega.

   Configuração: Supabase → Project Settings → API.
   A chave "anon" é pública por natureza — quem protege o banco são
   as regras de RLS dos arquivos .sql em dados/. Nunca use aqui a chave
   service_role, que ignora todas as regras.
   ============================================================ */
const SUPABASE_URL='https://asyqrlmdeptztggapdnn.supabase.co';
const SUPABASE_ANON='sb_publishable_2MwWorspfb9vupsGpmsGyw_qKz9IG-N';

const IMG='imagens/';
/* aceita a URL colada com barra no fim ou já com /rest/v1 junto:
   o SDK monta os caminhos sozinho a partir da Project URL */
const BASE=SUPABASE_URL.trim().replace(/\/+$/,'').replace(/\/rest\/v1$/,'');
const sb=(BASE&&SUPABASE_ANON&&window.supabase)
  ? window.supabase.createClient(BASE,SUPABASE_ANON) : null;
/* painel do próprio Supabase: é lá que se cria e remove quem tem acesso */
const PAINEL_SUPABASE=BASE?`https://supabase.com/dashboard/project/${new URL(BASE).hostname.split(".")[0]}`:"https://supabase.com/dashboard";

const app=document.getElementById('app');
const grade=document.getElementById('app-grade');
const portao=document.getElementById('portao');

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* usado na busca: "seguranca" precisa encontrar "Segurança" */
const semAcento=s=>String(s||'').normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase();
/* usado no endereço do projeto — o corte de 60 vale só aqui */
const slug=s=>semAcento(s).replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'').slice(0,60);
const dataBR=d=>{const x=d?new Date(d):null;return x&&!isNaN(x)?x.toLocaleDateString('pt-BR'):'—'};
const soData=d=>d?String(d).slice(0,10):'';
const saudacao=()=>{const h=new Date().getHours();return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'};

const EIXOS=['Direitos e cidadania','Pessoas idosas','Mulheres',
 'Segurança alimentar','Saúde e convivência','Juventude'];
const CORES={'Direitos e cidadania':'var(--folha)','Pessoas idosas':'var(--laranja)',
 'Mulheres':'var(--magenta)','Segurança alimentar':'var(--verde)',
 'Saúde e convivência':'var(--agua)','Juventude':'var(--vermelho)'};
const ponto=e=>`<span style="display:inline-block;width:11px;height:11px;border-radius:50%;
 background:${CORES[e]||'var(--folha)'};margin-right:9px;vertical-align:-1px"></span>`;
const selo=pub=>`<span class="selo ${pub?'publicado':'rascunho'}">${pub?'Publicado':'Rascunho'}</span>`;

let PROJETOS=[];
let CONTEUDO={};   /* blocos da tabela conteudo, por id */
let CONTEUDO_EM={}; /* quando cada bloco foi salvo pela última vez */
let usuario='';
let edicao={id:null,capa:'',sujo:false};

/* ---------- retorno de ação ---------- */
let recadoTimer=null;
function recado(msg,ruim){
  document.querySelectorAll('.recado').forEach(n=>n.remove());
  const d=document.createElement('div');
  d.className='recado'+(ruim?' ruim':'');
  d.setAttribute('role','status');
  d.textContent=msg;
  document.body.appendChild(d);
  clearTimeout(recadoTimer);
  recadoTimer=setTimeout(()=>d.remove(),ruim?8000:3500);
}

/* ---------- entrada ---------- */
async function iniciar(){
  if(!sb) return portaoSemConfig();
  const {data:{session}}=await sb.auth.getSession();
  if(session) await abrirPainel(session); else mostrarPortao();
  sb.auth.onAuthStateChange((_ev,s)=>{if(!s){PROJETOS=[];mostrarPortao();}});
}

function portaoSemConfig(){
  portao.hidden=false; grade.hidden=true;
  document.getElementById('camposLogin').hidden=true;
  document.getElementById('portaoTexto').innerHTML=
    'Falta ligar o banco de dados. Rode <b>dados/supabase.sql</b> no SQL Editor do Supabase, '+
    'crie seu usuário em Authentication → Users e preencha <b>SUPABASE_URL</b> e '+
    '<b>SUPABASE_ANON</b> no topo do script deste arquivo e do index.html.';
}

function mostrarPortao(){portao.hidden=false;grade.hidden=true;}

async function abrirPainel(session){
  const email=session.user.email||'';
  usuario=email.split('@')[0];
  document.getElementById('usuarioEmail').textContent=email;
  document.getElementById('usuarioNome').textContent=usuario;
  document.getElementById('avatar').textContent=email.slice(0,2).toUpperCase();
  portao.hidden=true; grade.hidden=false;
  await carregar();
  render();
}

document.getElementById('formLogin').onsubmit=async e=>{
  e.preventDefault();
  if(!sb) return;
  const erro=document.getElementById('erroLogin'), btn=document.getElementById('btnEntrar');
  erro.hidden=true; btn.disabled=true; btn.textContent='Entrando…';
  const {data,error}=await sb.auth.signInWithPassword({
    email:document.getElementById('email').value.trim(),
    password:document.getElementById('senha').value});
  btn.disabled=false; btn.textContent='Entrar';
  if(error){
    erro.textContent='Não foi possível entrar. Confira e-mail e senha.';
    erro.hidden=false; return;
  }
  document.getElementById('senha').value='';
  abrirPainel(data.session);
};

document.getElementById('btnSair').onclick=async()=>{
  if(edicao.sujo&&!confirm('Há alterações não salvas. Sair mesmo assim?')) return;
  edicao.sujo=false;
  await sb.auth.signOut();
  PROJETOS=[];
  location.hash='#/';
  mostrarPortao();   /* não depender só do onAuthStateChange para fechar o painel */
};

/* ---------- dados ---------- */
async function carregar(){
  const {data,error}=await sb.from('projetos').select('*')
    .order('atualizado_em',{ascending:false});
  if(error){recado('Não foi possível carregar os projetos: '+error.message,true);return;}
  PROJETOS=data||[];
  document.getElementById('contaProjetos').textContent=PROJETOS.length;
  await carregarConteudo();
}

/* Os blocos de conteúdo (números, contato) vivem numa tabela só, com o
   conteúdo em jsonb. Se a tabela ainda não existir, o painel segue
   funcionando: essas telas avisam que falta rodar dados/conteudo.sql. */
async function carregarConteudo(){
  const {data,error}=await sb.from('conteudo').select('id,dados,atualizado_em');
  if(error){CONTEUDO={_erro:error.message};return;}
  CONTEUDO={}; CONTEUDO_EM={};
  (data||[]).forEach(r=>{CONTEUDO[r.id]=r.dados||{};CONTEUDO_EM[r.id]=r.atualizado_em;});
  contarAvisos();
}

const semTabela=()=>!!CONTEUDO._erro;
const bloco=(id,padrao)=>({...padrao,...(CONTEUDO[id]||{})});

const avisoTabela=`<div class="maquete"><b>Falta criar a tabela de conteúdo.</b>
 Rode <b>dados/conteudo.sql</b> no SQL Editor do Supabase e recarregue esta página.
 Até lá o que você editar aqui não é salvo.</div>`;

/* devolve true quando gravou */
async function salvarBloco(id,dados,botoes,msg){
  if(semTabela()){recado('A tabela de conteúdo ainda não existe. Rode dados/conteudo.sql.',true);return false;}
  botoes.forEach(b=>b&&(b.disabled=true));
  const {error}=await sb.from('conteudo').upsert({id,dados});
  botoes.forEach(b=>b&&(b.disabled=false));
  if(error){recado('Não foi possível salvar: '+error.message,true);return false;}
  CONTEUDO[id]=dados;
  CONTEUDO_EM[id]=new Date().toISOString();
  edicao.sujo=false;
  recado(msg||'Salvo e publicado no site.');
  return true;
}

const calcularNumero=(fonte,desde)=>{
  const pub=PROJETOS.filter(p=>p.publicado);
  if(fonte==='anos')   return String(new Date().getFullYear()-(Number(desde)||NUMEROS_PADRAO.desde));
  if(fonte==='total')  return String(pub.length);
  if(fonte==='ativos') return String(pub.filter(p=>p.status==='ativo').length);
  return '';
};

function lerForm(){
  const v=n=>{const el=app.querySelector(`[data-campo="${n}"]`);return el?el.value.trim():''};
  return {
    titulo:v('titulo'), nome:v('nome'), resumo:v('resumo'), objeto:v('objeto'), texto:v('texto'),
    eixo:v('eixo'), status:v('status'), termo:v('termo'), periodo:v('periodo'),
    valor:v('valor'), publico:v('publico'),
    inicio:v('inicio')||null, fim:v('fim')||null,
    capa:edicao.capa||null,
    resultados:[...app.querySelectorAll('[data-resultado]')].map(i=>i.value.trim()).filter(Boolean)
  };
}

function validar(d){
  if(!d.titulo) return 'O nome do projeto é obrigatório.';
  if(!d.nome) return 'O nome curto é obrigatório: é ele que aparece na linha do tempo.';
  if(d.nome.length>28) return 'O nome curto passa de 28 caracteres.';
  if(!EIXOS.includes(d.eixo)) return 'Escolha uma área de atuação.';
  if(!d.inicio||!d.fim) return 'Informe início e fim previsto: são eles que posicionam a barra na linha do tempo.';
  if(d.fim<d.inicio) return 'O fim previsto é anterior ao início.';
  return '';
}

function travar(sim){
  app.querySelectorAll('#salvarTopo,#salvarRascunho,#publicar,#descartar')
    .forEach(b=>b.disabled=sim);
}

async function salvar(publicado){
  const d=lerForm();
  const problema=validar(d);
  if(problema) return recado(problema,true);
  const id=edicao.id||slug(d.nome||d.titulo);
  if(!id) return recado('Não consegui gerar um endereço a partir desse nome.',true);
  if(!edicao.id&&PROJETOS.some(x=>x.id===id))
    return recado('Já existe um projeto no endereço "'+id+'". Mude o nome curto.',true);

  travar(true);
  const {error}=await sb.from('projetos').upsert({id,publicado,...d});
  travar(false);
  if(error) return recado('Não foi possível salvar: '+error.message,true);

  const eraNovo=!edicao.id;
  edicao.sujo=false;
  await carregar();
  recado(publicado?'Publicado no site.':'Salvo como rascunho.');
  if(eraNovo) location.hash='#/projeto/'+encodeURIComponent(id); else render();
}

async function enviarCapa(arquivo){
  const ext=(arquivo.name.split('.').pop()||'png').toLowerCase();
  const base=slug(arquivo.name.replace(/\.[^.]+$/,''))||'capa';
  const caminho=`${Date.now()}-${base}.${ext}`;
  const {error}=await sb.storage.from('capas').upload(caminho,arquivo,{cacheControl:'3600'});
  if(error) throw error;
  return sb.storage.from('capas').getPublicUrl(caminho).data.publicUrl;
}

function ligarForm(){
  app.querySelectorAll('input,textarea,select').forEach(el=>
    el.addEventListener('input',()=>{edicao.sujo=true;contadores();}));
  contadores();

  const caixa=app.querySelector('#resultados');
  app.querySelector('#addResultado').onclick=()=>{
    caixa.insertAdjacentHTML('beforeend',linhaResultado(''));
    const novo=caixa.lastElementChild.querySelector('input');
    novo.addEventListener('input',()=>{edicao.sujo=true});
    novo.focus(); edicao.sujo=true;
  };
  caixa.onclick=e=>{
    const b=e.target.closest('[data-remover]'); if(!b) return;
    if(caixa.children.length>1) b.parentElement.remove();
    else b.parentElement.querySelector('input').value='';
    edicao.sujo=true;
  };

  const arquivo=app.querySelector('#arquivoCapa');
  const btnCapa=app.querySelector('#btnCapa');
  const abrir=()=>arquivo.click();
  btnCapa.onclick=abrir;
  app.querySelector('#areaCapa').onclick=abrir;
  arquivo.onchange=async()=>{
    const f=arquivo.files[0]; if(!f) return;
    if(f.size>5*1024*1024){arquivo.value='';return recado('Imagem maior que 5 MB. Reduza antes de enviar.',true);}
    btnCapa.disabled=true; btnCapa.textContent='Enviando…';
    try{
      const url=await enviarCapa(f);
      edicao.capa=url; edicao.sujo=true;
      const previa=app.querySelector('#previaCapa');
      previa.src=url; previa.hidden=false;
      app.querySelector('#areaCapa').hidden=true;
      btnCapa.textContent='Trocar imagem';
      recado('Imagem enviada. Salve o projeto para valer.');
    }catch(e){
      recado('Não foi possível enviar a imagem: '+e.message,true);
      btnCapa.textContent=edicao.capa?'Trocar imagem':'Escolher imagem';
    }
    btnCapa.disabled=false; arquivo.value='';
  };

  app.querySelector('#salvarTopo').onclick=()=>{
    const atual=edicao.id?(PROJETOS.find(x=>x.id===edicao.id)||{}).publicado:true;
    salvar(!!atual);
  };
  app.querySelector('#salvarRascunho').onclick=()=>salvar(false);
  app.querySelector('#publicar').onclick=()=>salvar(true);
  app.querySelector('#descartar').onclick=()=>{
    if(edicao.sujo&&!confirm('Descartar as alterações não salvas?')) return;
    edicao.sujo=false; location.hash='#/projetos';
  };
  app.querySelector('#verSite').onclick=()=>{
    if(!edicao.id) return recado('Salve o projeto primeiro para poder vê-lo no site.',true);
    const p=PROJETOS.find(x=>x.id===edicao.id);
    if(p&&!p.publicado) recado('Este projeto está como rascunho: o site vai dizer que não encontrou.');
    window.open('index.html#/projeto/'+encodeURIComponent(edicao.id),'_blank','noopener');
  };
}

function contadores(){
  app.querySelectorAll('[data-contador]').forEach(c=>{
    const campo=app.querySelector(`[data-campo="${c.dataset.contador}"]`);
    if(!campo) return;
    const max=Number(campo.getAttribute('maxlength'))||0;
    c.textContent=`${campo.value.length} / ${max}`;
    c.classList.toggle('estourou',max&&campo.value.length>=max);
  });
}

/* ---------- lista de projetos ---------- */
function ligarLista(){
  const busca=app.querySelector('#busca'), situacao=app.querySelector('#situacao'),
        corpo=app.querySelector('#corpoProjetos'), conta=app.querySelector('#contaLista');
  const aplicar=()=>{
    const termo=semAcento(busca.value).trim();
    const s=situacao.value;
    const lista=PROJETOS.filter(p=>{
      const acha=!termo||semAcento(`${p.titulo} ${p.nome} ${p.termo||''} ${p.eixo}`).includes(termo);
      const bate=!s||(s==='rascunho'?!p.publicado:p.status===s);
      return acha&&bate;
    });
    corpo.innerHTML=linhasProjetos(lista);
    conta.textContent=lista.length===PROJETOS.length
      ? `${PROJETOS.length} projetos`
      : `${lista.length} de ${PROJETOS.length} projetos`;
  };
  busca.oninput=aplicar;
  situacao.onchange=aplicar;
}

/* ---------- tela: números do topo ---------- */
function lerNumeros(){
  const desde=Number(app.querySelector('#desde').value)||NUMEROS_PADRAO.desde;
  const itens=[...app.querySelectorAll('[data-numero]')].map(l=>{
    const g=n=>l.querySelector(`[data-n="${n}"]`);
    const fonte=g('fonte').value;
    const it={fonte,rotulo:g('rotulo').value.trim()};
    /* o número calculado não é gravado: ele se refaz a cada visita */
    if(fonte==='manual') it.numero=g('numero').value.trim();
    return it;
  }).filter(it=>it.rotulo||it.numero);
  return {desde,itens};
}

/* mantem o campo do número coerente com a fonte escolhida */
function sincronizarLinha(linha){
  const fonte=linha.querySelector('[data-n="fonte"]').value;
  const campo=linha.querySelector('[data-n="numero"]');
  const auto=fonte!=='manual';
  campo.disabled=auto;
  if(auto) campo.value=calcularNumero(fonte,app.querySelector('#desde').value);
}

function ligarNumeros(){
  const lista=app.querySelector('#listaNumeros');
  const add=app.querySelector('#addNumero');
  const sincronizarTudo=()=>lista.querySelectorAll('[data-numero]').forEach(sincronizarLinha);
  const limite=()=>add.disabled=lista.children.length>=4;

  app.querySelector('#telaNumeros').addEventListener('input',()=>{edicao.sujo=true;});
  app.querySelector('#desde').addEventListener('input',sincronizarTudo);
  lista.addEventListener('change',e=>{
    const l=e.target.closest('[data-numero]');
    if(l&&e.target.matches('[data-n="fonte"]')){sincronizarLinha(l);edicao.sujo=true;}
  });
  lista.addEventListener('click',e=>{
    if(!e.target.closest('[data-remover]')) return;
    if(lista.children.length<=1) return recado('A faixa precisa de pelo menos um número.',true);
    e.target.closest('[data-numero]').remove(); limite(); edicao.sujo=true;
  });
  add.onclick=()=>{
    if(lista.children.length>=4) return;
    lista.insertAdjacentHTML('beforeend',linhaNumero({fonte:'manual'},app.querySelector('#desde').value));
    lista.lastElementChild.querySelector('[data-n="numero"]').focus();
    limite(); edicao.sujo=true;
  };

  const botoes=[app.querySelector('#salvarNumeros'),app.querySelector('#salvarNumeros2')];
  const salvar=()=>{
    const d=lerNumeros();
    if(!d.itens.length) return recado('Preencha ao menos um número.',true);
    const semRotulo=d.itens.find(it=>!it.rotulo);
    if(semRotulo) return recado('Cada número precisa de um rótulo, como "pessoas atendidas".',true);
    const vazio=d.itens.find(it=>it.fonte==='manual'&&!it.numero);
    if(vazio) return recado(`Falta o número de "${vazio.rotulo}".`,true);
    salvarBloco('numeros',d,botoes,'Números publicados no site.');
  };
  botoes.forEach(b=>b&&(b.onclick=salvar));
  sincronizarTudo(); limite();
}

/* ---------- tela: contato e rodapé ---------- */
function ligarContato(){
  const previa=app.querySelector('#previaContato');
  const ler=()=>{
    const d={};
    app.querySelectorAll('[data-contato]').forEach(i=>d[i.dataset.contato]=i.value.trim());
    return d;
  };
  const pintar=()=>{
    const c=ler();
    previa.innerHTML=`
      ${c.frase?`<span style="display:block;margin-bottom:10px">${esc(c.frase)}</span>`:''}
      <b style="color:var(--texto)">${esc(c.telefone||'—')}</b><br>
      ${esc(c.email||'—')}<br>
      ${esc(c.endereco||'—')}<br>${esc(c.bairro||'')}<br>
      <span style="font-size:.82rem">${esc(c.horario||'')}</span><br>
      <span style="font-family:var(--dado);font-size:.76rem">CNPJ ${esc(c.cnpj||'—')}</span>`;
  };
  app.querySelectorAll('[data-contato]').forEach(i=>
    i.addEventListener('input',()=>{edicao.sujo=true;pintar();}));
  pintar();

  const botoes=[app.querySelector('#salvarContato'),app.querySelector('#salvarContato2')];
  const salvar=()=>{
    const c=ler();
    if(!c.telefone&&!c.email) return recado('Informe ao menos um telefone ou um e-mail.',true);
    if(c.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c.email)) return recado('O e-mail não parece válido.',true);
    const url=['instagram','facebook','cursos'].find(k=>c[k]&&!/^https?:\/\//i.test(c[k]));
    if(url) return recado(`O endereço de ${url} precisa começar com https://`,true);
    salvarBloco('contato',c,botoes,'Contato publicado no site.');
  };
  botoes.forEach(b=>b&&(b.onclick=salvar));
}

/* ---------- tela: avisos e novidades ----------
   Bloco "avisos" da tabela conteudo. O formato de cada item e a regra de
   "no ar / agendado / encerrado / pausado" estão em dados/padroes.js, que
   o site também usa — os dois nunca discordam sobre o que está no ar. */
const avisosSalvos=()=>{const l=bloco('avisos',AVISOS_PADRAO).itens;return Array.isArray(l)?l:[];};
const gravarAvisos=(itens,botoes,msg)=>
  salvarBloco('avisos',{...bloco('avisos',AVISOS_PADRAO),itens},botoes,msg);

function contarAvisos(){
  const n=avisosSalvos().filter(a=>situacaoDoAviso(a)==='no-ar').length;
  const el=document.getElementById('contaAvisos'); if(el) el.textContent=n||'';
}

/* "2026-10-15" → "15/10/2026" sem passar por Date: new Date("2026-10-15")
   é meia-noite em UTC, que em Campo Grande ainda é dia 14 */
const diaBR=d=>d?String(d).slice(0,10).split('-').reverse().join('/'):'';
const periodoAviso=a=>a.inicio&&a.fim?`${diaBR(a.inicio)} a ${diaBR(a.fim)}`
  :a.inicio?`a partir de ${diaBR(a.inicio)}`:a.fim?`até ${diaBR(a.fim)}`:'sem data para sair';
const SITUACOES={'no-ar':['No ar','publicado'],agendado:['Agendado','ativo'],
  encerrado:['Encerrado','encerrado'],pausado:['Pausado','rascunho']};

const linhaAviso=(a,i,n)=>{
  const t=TIPOS_AVISO[a.tipo]||TIPOS_AVISO.novidade, [rotulo,classe]=SITUACOES[situacaoDoAviso(a)];
  return `<tr data-i="${i}">
  <td><div class="item">${a.imagem?`<img class="miniatura" src="${esc(a.imagem)}" alt="" style="object-fit:cover;padding:0">`
    :`<span class="miniatura" style="background:${t.clara};display:grid;place-items:center"><span class="ponto-tipo" style="background:${t.cor};margin:0"></span></span>`}
    <div><b>${esc(a.titulo)}</b><small><span class="ponto-tipo" style="background:${t.cor}"></span>${esc(t.rotulo)}</small></div></div></td>
  <td style="font-family:var(--dado);font-size:.8rem;color:var(--texto-2)">${periodoAviso(a)}</td>
  <td><span class="selo ${classe}">${rotulo}</span></td>
  <td><div style="display:flex;gap:2px">
    <button class="btn fantasma" data-mover="-1" type="button" ${i===0?'disabled':''} aria-label="Subir">↑</button>
    <button class="btn fantasma" data-mover="1" type="button" ${i===n-1?'disabled':''} aria-label="Descer">↓</button></div></td>
  <td class="acoes"><a class="btn fantasma" href="#/aviso/${encodeURIComponent(a.id)}">Editar</a></td></tr>`;
};

/* a ordem da lista é a ordem no site: mexeu, já grava */
function ligarAvisos(){
  const corpo=app.querySelector('#corpoAvisos'); if(!corpo) return;
  corpo.addEventListener('click',async e=>{
    const b=e.target.closest('[data-mover]'); if(!b) return;
    const lista=avisosSalvos().slice();
    const i=Number(b.closest('[data-i]').dataset.i), j=i+Number(b.dataset.mover);
    if(j<0||j>=lista.length) return;
    [lista[i],lista[j]]=[lista[j],lista[i]];
    corpo.querySelectorAll('button').forEach(x=>x.disabled=true);
    await gravarAvisos(lista,[],'Ordem salva. O site já mostra assim.');
    render();
  });
}

function previaAviso(a){
  const t=TIPOS_AVISO[a.tipo]||TIPOS_AVISO.novidade;
  return `<div class="aviso-previa" style="background:${t.clara};box-shadow:inset 6px 0 0 ${t.cor}">
    ${a.imagem?`<img src="${esc(a.imagem)}" alt="">`:''}
    <div style="min-width:0"><p class="aviso-previa-tipo" style="color:${t.texto}">${esc(t.rotulo)}</p>
      <b>${esc(a.titulo||'O título aparece aqui')}</b>
      ${a.texto?`<p>${esc(a.texto)}</p>`:''}
      ${a.link?`<span class="aviso-previa-botao" style="background:${t.texto}">${esc(a.botao||'Saiba mais')} →</span>`:''}
    </div></div>`;
}

function explicarSituacao(a){
  const s=situacaoDoAviso(a);
  if(s==='no-ar') return `<b>No ar ao salvar</b>${a.fim?`Sai do site sozinho depois de ${diaBR(a.fim)}.`:'Fica no site até você pausar ou remover.'}`;
  if(s==='agendado') return `<b>Agendado</b>Entra no site sozinho em ${diaBR(a.inicio)}${a.fim?` e sai depois de ${diaBR(a.fim)}`:''}.`;
  if(s==='encerrado') return `<b>Período encerrado</b>A data final já passou: salvo assim, ele não aparece no site.`;
  return `<b>Pausado</b>Fica guardado aqui, mas não aparece no site.`;
}

/* para onde o botão leva: página do site, um projeto ou um endereço de fora */
function destinosAviso(link){
  link=link||'';
  const paginasSite=[['#/quem-somos','Quem somos'],['#/projetos','Projetos'],['#/contato','Contato'],['#/cursos','Cursos']];
  const projetos=PROJETOS.filter(p=>p.publicado).map(p=>['#/projeto/'+p.id,p.titulo]);
  const externo=/^https?:/i.test(link);
  /* projeto que deixou de ser publicado continua na lista, para não sumir calado */
  const conhecido=!link||externo||[...paginasSite,...projetos].some(([v])=>v===link);
  const op=([v,r])=>`<option value="${esc(v)}" ${v===link?'selected':''}>${esc(r)}</option>`;
  return `<option value="">Sem botão</option>
    <optgroup label="Página do site">${paginasSite.map(op).join('')}</optgroup>
    ${projetos.length?`<optgroup label="Projeto">${projetos.map(op).join('')}</optgroup>`:''}
    ${conhecido?'':op([link,'Endereço salvo: '+link])}
    <option value="externo" ${externo?'selected':''}>Outro endereço (fora do site)…</option>`;
}

  return `

    <button class="btn" id="salvarAviso" type="button">${novo?'Criar aviso':'Salvar alterações'}</button>
  </div>
  ${semTabela()?avisoTabela:''}
  <div class="form" id="formAviso">
    <div class="caixa">

      <div class="campo" id="campoUrl" ${externo?'':'hidden'}><label for="av-url">Endereço<small>Completo, começando com https://</small></label>

      <div class="campo" style="margin-bottom:0"><label>Imagem<small>Opcional. Aparece pequena, ao lado do texto, e fica guardada em Fotos e arquivos.</small></label>

          <img id="av-img" class="carrossel-foto" style="width:72px;height:72px" alt="" hidden>

function lerAviso(){
  const g=n=>{const el=app.querySelector(`[data-av="${n}"]`);return el?el.value.trim():'';};
  const destino=g('destino');
  const link=destino==='externo'?g('url'):destino;
  return {id:edicao.id||'',tipo:g('tipo'),titulo:g('titulo'),texto:g('texto'),
    link,botao:link?(g('botao')||'Saiba mais'):'',imagem:edicao.capa||'',
    inicio:g('inicio'),fim:g('fim'),pausado:g('situacao')==='pausado'};
}

/* devolve [mensagem, campo] do primeiro problema, ou null */
function validarAviso(d,destino){
  if(!d.titulo) return ['O título é obrigatório.','titulo'];
  if(destino==='externo'&&!/^https?:\/\/[^\s.]+\.\S+/i.test(d.link))
    return ['O endereço do botão precisa ser completo, começando com https://','url'];
  if(d.inicio&&d.fim&&d.fim<d.inicio) return ['A data “até” é anterior à data “a partir de”.','fim'];
  return null;
}

function ligarAviso(){
  const caixa=app.querySelector('#formAviso');
  const destino=app.querySelector('[data-av="destino"]');
  const pintar=()=>{
    const d=lerAviso();
    app.querySelector('#campoUrl').hidden=destino.value!=='externo';
    app.querySelector('#campoBotao').hidden=!destino.value;
    app.querySelector('#previaAviso').innerHTML=previaAviso(d);
    app.querySelector('#situacaoAviso').innerHTML=explicarSituacao(d);
    app.querySelectorAll('[data-contador-av]').forEach(c=>{
      const el=app.querySelector(`[data-av="${c.dataset.contadorAv}"]`);
      c.textContent=`${el.value.length} / ${el.maxLength}`;
      c.classList.toggle('estourou',el.value.length>=el.maxLength);
    });
  };
  const mexeu=()=>{edicao.sujo=true;pintar();};
  caixa.addEventListener('input',mexeu);
  caixa.addEventListener('change',mexeu);   /* datas e seletores */

  const arquivo=app.querySelector('#av-arquivo'), escolher=app.querySelector('#av-escolher'),
        tirar=app.querySelector('#av-tirar'), img=app.querySelector('#av-img');
  const mostrarImagem=()=>{
    if(edicao.capa) img.src=edicao.capa; else img.removeAttribute('src');
    img.hidden=tirar.hidden=!edicao.capa;
    escolher.textContent=edicao.capa?'Trocar imagem':'Escolher imagem';
    pintar();
  };
  escolher.onclick=()=>arquivo.click();
  tirar.onclick=()=>{edicao.capa='';edicao.sujo=true;mostrarImagem();};
  arquivo.onchange=async()=>{
    const f=arquivo.files[0]; arquivo.value=''; if(!f) return;
    escolher.disabled=true; escolher.textContent='Enviando…';
    try{
      edicao.capa=await subirFoto(f,600);   /* aparece com menos de 100px: 600 sobra */
      edicao.sujo=true;
      recado('Imagem enviada. Salve o aviso para valer.');
    }catch(e){recado(e.message,true);}
    escolher.disabled=false; mostrarImagem();
  };
  mostrarImagem();

  const botoes=[app.querySelector('#salvarAviso'),app.querySelector('#salvarAviso2')];
  const salvar=async()=>{
    const d=lerAviso(), problema=validarAviso(d,destino.value);
    if(problema){
      recado(problema[0],true);
      const el=app.querySelector(`[data-av="${problema[1]}"]`); if(el) el.focus();
      return;
    }
    if(!d.id) d.id='av-'+Date.now().toString(36);
    const lista=avisosSalvos().slice(), i=lista.findIndex(x=>x.id===d.id);
    if(i>=0) lista[i]=d; else lista.unshift(d);   /* aviso novo entra no topo */
    const s=situacaoDoAviso(d);
    const msg=s==='no-ar'?'Aviso publicado no site.'
      :s==='agendado'?`Aviso agendado: entra no site em ${diaBR(d.inicio)}.`
      :s==='pausado'?'Aviso salvo e pausado: não aparece no site.'
      :'Aviso salvo, mas o período já terminou: não aparece no site.';
    if(await gravarAvisos(lista,botoes,msg)){contarAvisos();location.hash='#/avisos';}
  };
  botoes.forEach(b=>b.onclick=salvar);

  const remover=app.querySelector('#removerAviso');
  if(remover) remover.onclick=async()=>{
    if(!confirm('Remover este aviso? Ele sai do site e não dá para desfazer.')) return;
    const lista=avisosSalvos().filter(x=>x.id!==edicao.id);
    if(await gravarAvisos(lista,[remover,...botoes],'Aviso removido.')){contarAvisos();location.hash='#/avisos';}
  };
}

/* ---------- tela: textos de uma página ----------
   O formulário sai da descrição da página em dados/padroes.js: cada campo
   de lá vira um campo aqui, e o site lê o mesmo bloco "pagina:<id>". */
const linhaAtividade=a=>`<div class="repetidor" data-atividade>
  <input type="text" data-a="icone" value="${esc(a.icone)}" aria-label="Ícone (emoji)" placeholder="🙂"
    style="flex:0 0 40px;text-align:center;font-size:1.2rem">
  <div class="atividade-textos">
    <input type="text" data-a="nome" value="${esc(a.nome)}" placeholder="Nome da atividade" aria-label="Nome da atividade" style="font-weight:500">
    <input type="text" data-a="texto" value="${esc(a.texto)}" placeholder="Uma frase sobre ela" aria-label="Descrição da atividade"
      style="font-size:.88rem;color:var(--texto-2)">
  </div>
  <button class="btn fantasma" data-remover type="button" aria-label="Remover atividade">✕</button></div>`;

function campoPagina(c,v){
  const id='p-'+c.k;
  const rotulo=`${esc(c.rotulo)}${c.dica?`<small>${esc(c.dica)}</small>`:''}`;
  if(c.tipo==='atividades') return `<div class="campo"><label>${rotulo}</label>
    <div data-p="${c.k}">${(Array.isArray(v)?v:[]).map(linhaAtividade).join('')}</div>
    <button class="btn linha" data-mais="${c.k}" type="button" style="margin-top:4px">+ Adicionar atividade</button></div>`;
  if(c.tipo==='titulo'||c.tipo==='linha') return `<div class="campo"><label for="${id}">${rotulo}</label>
    <input type="text" id="${id}" data-p="${c.k}" value="${esc(v)}"></div>`;
  const texto=c.tipo==='lista'?(Array.isArray(v)?v:[]).join('\n'):String(v??'');
  const altura=c.tipo==='paragrafos'?170:c.tipo==='lista'?Math.min(300,48+texto.split('\n').length*25):96;
  return `<div class="campo"><label for="${id}">${rotulo}</label>
    <textarea id="${id}" data-p="${c.k}" style="min-height:${altura}px">${esc(texto)}</textarea></div>`;
}

function formPagina(id,valores){
  const pg=PAGINAS.find(p=>p.id===id);
  if(!pg) return `
    <div class="topo"><div><a class="btn fantasma" href="#/paginas" style="padding-left:0">← Páginas</a>
      <h1 style="margin-top:6px">Página não encontrada</h1></div></div>
    <div class="painel"><div class="vazio"><b>Esse endereço não existe</b>Volte para a lista de páginas.</div></div>`;
  const t=valores||bloco('pagina:'+id,TEXTOS_PADRAO[id]);
  return `
  <div class="topo">
    <div><a class="btn fantasma" href="#/paginas" style="padding-left:0">← Páginas</a>
      <h1 style="margin-top:6px">${esc(pg.nome)}</h1>
      <p style="font-family:var(--dado);font-size:.78rem">Endereço no site: /#${esc(pg.rota)}</p></div>
    <div style="display:flex;gap:8px">
      <button class="btn linha" id="verPagina" type="button">Ver no site</button>
      <button class="btn" id="salvarPagina" type="button">Salvar e publicar</button>
    </div>
  </div>
  ${semTabela()?avisoTabela:''}
  <div class="form" id="formPagina" data-pagina="${esc(pg.id)}">
    <div>
      ${pg.secoes.map((s,i)=>`<div class="caixa" id="secao-${i}" style="margin-bottom:16px"><h2>${esc(s.titulo)}</h2>
        ${s.campos.map(c=>campoPagina(c,t[c.k])).join('')}</div>`).join('')}
      <div style="display:flex;justify-content:flex-end;margin-top:22px">
        <button class="btn" id="salvarPagina2" type="button">Salvar e publicar</button></div>
    </div>
    <div>
      ${pg.secoes.length>2?`<div class="caixa" style="margin-bottom:16px"><h2>Nesta página</h2>
        ${pg.secoes.map((s,i)=>`<button class="btn fantasma indice" data-ir="${i}" type="button">${esc(s.titulo)}</button>`).join('')}</div>`:''}
      <div class="dica" style="margin-top:0"><b>Campo vazio some do site</b>Se você apagar uma chamada, um texto ou uma lista, aquele pedaço simplesmente não aparece na página. Só os títulos são obrigatórios.</div>
      <button class="btn fantasma" id="restaurarPagina" type="button" style="margin-top:12px">Voltar ao texto original</button>
    </div>
  </div>`;
}

function lerPagina(pg){
  const d={};
  pg.secoes.flatMap(s=>s.campos).forEach(c=>{
    const el=app.querySelector(`[data-p="${c.k}"]`); if(!el) return;
    if(c.tipo==='atividades') d[c.k]=[...el.querySelectorAll('[data-atividade]')].map(l=>{
        const g=n=>l.querySelector(`[data-a="${n}"]`).value.trim();
        return {icone:g('icone'),nome:g('nome'),texto:g('texto')};
      }).filter(a=>a.icone||a.nome||a.texto);
    else if(c.tipo==='lista') d[c.k]=el.value.split('\n').map(s=>s.trim()).filter(Boolean);
    /* linha em branco entre parágrafos deixa o texto legível no próprio campo */
    else if(c.tipo==='paragrafos') d[c.k]=el.value.split(/\n+/).map(s=>s.trim()).filter(Boolean).join('\n\n');
    else d[c.k]=el.value.trim();
  });
  return d;
}

/* devolve [mensagem, campo] do primeiro problema, ou null */
function validarPagina(pg,d){
  for(const s of pg.secoes) for(const c of s.campos){
    if(c.tipo==='titulo'&&!d[c.k])
      return [`Preencha “${c.rotulo}” em ${s.titulo}: é obrigatório.`,app.querySelector(`[data-p="${c.k}"]`)];
    if(c.tipo==='atividades'){
      const sem=(d[c.k]||[]).findIndex(a=>!a.nome);
      if(sem>=0) return [`Uma atividade em ${s.titulo} está sem nome.`,
        app.querySelectorAll(`[data-p="${c.k}"] [data-a="nome"]`)[sem]];
    }
  }
  return null;
}

function ligarPagina(){
  const caixa=app.querySelector('#formPagina');
  const pg=PAGINAS.find(p=>p.id===caixa.dataset.pagina);
  /* a caixa de texto cresce com o conteúdo: texto longo não fica escondido */
  const ajustar=t=>{t.style.height='auto';t.style.height=(t.scrollHeight+3)+'px';};
  caixa.querySelectorAll('textarea').forEach(ajustar);
  caixa.addEventListener('input',e=>{
    edicao.sujo=true;
    if(e.target.matches('textarea')) ajustar(e.target);
  });

  caixa.addEventListener('click',e=>{
    const ir=e.target.closest('[data-ir]');
    if(ir) return app.querySelector('#secao-'+ir.dataset.ir).scrollIntoView({behavior:'smooth',block:'start'});
    const mais=e.target.closest('[data-mais]');
    if(mais){
      const lista=caixa.querySelector(`[data-p="${mais.dataset.mais}"]`);
      lista.insertAdjacentHTML('beforeend',linhaAtividade({}));
      lista.lastElementChild.querySelector('[data-a="nome"]').focus();
      edicao.sujo=true; return;
    }
    const rem=e.target.closest('[data-atividade] [data-remover]');
    if(rem){rem.closest('[data-atividade]').remove();edicao.sujo=true;}
  });

  const botoes=[app.querySelector('#salvarPagina'),app.querySelector('#salvarPagina2')];
  const salvar=()=>{
    const d=lerPagina(pg);
    const problema=validarPagina(pg,d);
    if(problema){
      recado(problema[0],true);
      if(problema[1]){problema[1].focus();problema[1].scrollIntoView({block:'center'});}
      return;
    }
    salvarBloco('pagina:'+pg.id,d,botoes,`${pg.nome}: publicada no site.`);
  };
  botoes.forEach(b=>b.onclick=salvar);

  app.querySelector('#verPagina').onclick=()=>{
    if(edicao.sujo) recado('O site mostra a última versão salva. Salve para ver as mudanças.');
    window.open('index.html#'+pg.rota,'_blank','noopener');
  };
  app.querySelector('#restaurarPagina').onclick=()=>{
    if(!confirm('Trocar todos os campos pelo texto original? Nada muda no site até você salvar.')) return;
    app.innerHTML=formPagina(pg.id,TEXTOS_PADRAO[pg.id]);
    ligarPagina();
    edicao.sujo=true;
    recado('Texto original de volta nos campos. Salve para publicar.');
  };
}

/* ---------- tela: fotos e arquivos ----------
   As fotos ficam no bucket "fotos" do Supabase; as capas de projeto, no
   bucket "capas". O carrossel é o bloco "fotos" da tabela conteudo: uma
   lista ordenada de { src, alt } que a página inicial percorre. */
const BALDE_FOTOS='fotos';
const MAX_FOTO=5*1024*1024;
const SQL_FOTOS='Rode dados/fotos-e-acesso.sql no SQL Editor do Supabase e recarregue o painel.';
let midia={carrossel:[],fotos:[],capas:[]};

const tamanho=b=>!b?'':b<1024*1024?Math.max(1,Math.round(b/1024))+' KB':(b/1024/1024).toFixed(1).replace('.',',')+' MB';
const noCarrossel=url=>midia.carrossel.some(f=>f.src===url);
const noCarrosselPublicado=url=>(bloco('fotos',FOTOS_PADRAO).carrossel||[]).some(f=>f.src===url);
/* erro de permissão ou de bucket inexistente = o SQL das fotos não foi rodado */
const faltaSqlFotos=e=>/bucket not found|row-level security|violates|not authorized|unauthorized/i.test(String(e&&(e.message||e.error)||''));

async function listarBalde(balde){
  const {data,error}=await sb.storage.from(balde).list('',{limit:1000,sortBy:{column:'created_at',order:'desc'}});
  if(error) throw error;
  /* pastas vêm sem id; o marcador de pasta vazia não é foto */
  return (data||[]).filter(o=>o.id&&o.name!=='.emptyFolderPlaceholder').map(o=>({
    nome:o.name,url:sb.storage.from(balde).getPublicUrl(o.name).data.publicUrl,
    bytes:(o.metadata&&o.metadata.size)||0}));
}

/* foto de celular chega com 4000px e vários MB, e a capa mostra uns 600px.
   Reduz para 1600px no lado maior antes de enviar: o site abre mais rápido. */
async function reduzirFoto(arquivo,max=1600){
  let bmp;
  try{bmp=await createImageBitmap(arquivo);}catch(e){return arquivo;}
  const escala=Math.min(1,max/Math.max(bmp.width,bmp.height));
  if(escala===1&&arquivo.size<=1.5*1024*1024){bmp.close&&bmp.close();return arquivo;}
  const tela=document.createElement('canvas');
  tela.width=Math.round(bmp.width*escala); tela.height=Math.round(bmp.height*escala);
  const g=tela.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,tela.width,tela.height);   /* PNG transparente não vira fundo preto */
  g.drawImage(bmp,0,0,tela.width,tela.height);
  bmp.close&&bmp.close();
  const blob=await new Promise(r=>tela.toBlob(r,'image/jpeg',.85));
  return blob||arquivo;
}

const linhaCarrossel=(f,i,n)=>`<div class="repetidor" data-i="${i}">
  <img class="carrossel-foto" src="${esc(f.src)}" alt="">
  <input type="text" data-alt value="${esc(f.alt)}" placeholder="Descreva a foto" aria-label="Descrição da foto ${i+1}">
  <button class="btn fantasma" data-mover="-1" type="button" ${i===0?'disabled':''} aria-label="Subir">↑</button>
  <button class="btn fantasma" data-mover="1" type="button" ${i===n-1?'disabled':''} aria-label="Descer">↓</button>
  <button class="btn fantasma" data-tirar type="button" aria-label="Tirar do carrossel">✕</button></div>`;

function pintarCarrossel(){
  const caixa=app.querySelector('#listaCarrossel'); if(!caixa) return;
  const n=midia.carrossel.length;
  caixa.innerHTML=n?midia.carrossel.map((f,i)=>linhaCarrossel(f,i,n)).join('')
    :`<div class="vazio" style="padding:32px 12px"><b>Carrossel vazio</b>Escolha ao menos uma foto lá embaixo, em “Pôr no carrossel”.</div>`;
}

const figura=(f,acoes,legenda)=>`<figure>
  <img src="${esc(f.url)}" alt="" loading="lazy">
  <figcaption title="${esc(f.nome)}">${esc(legenda)}</figcaption>
  <div class="figura-acoes">${acoes}</div></figure>`;

function pintarGaleria(){
  const fotos=app.querySelector('#galeriaFotos'), capas=app.querySelector('#galeriaCapas');
  if(!fotos) return;
  /* as fotos que vêm com o site (pasta imagens/) também podem voltar ao carrossel */
  const doSite=FOTOS_PADRAO.carrossel.map(f=>({nome:f.src.split('/').pop(),url:f.src,doSite:true}));
  const todas=[...midia.fotos,...doSite];
  app.querySelector('#contaFotos').textContent=
    midia.fotos.length===1?'1 enviada':`${midia.fotos.length} enviadas`;
  fotos.innerHTML=`<div class="midia">${todas.map(f=>figura(f,
    (noCarrossel(f.url)?'<span class="selo publicado">No carrossel</span>'
      :`<button class="btn fantasma" data-por="${esc(f.url)}" type="button">Pôr no carrossel</button>`)+
    (f.doSite?'':`<button class="btn fantasma" data-apagar="${esc(f.nome)}" data-balde="${BALDE_FOTOS}" type="button">Apagar</button>`),
    f.doSite?'vem com o site':`${f.nome} · ${tamanho(f.bytes)}`)).join('')}</div>`;

  capas.innerHTML=midia.capas.length?`<div class="midia">${midia.capas.map(f=>{
    const dono=PROJETOS.find(p=>p.capa===f.url);
    return figura(f,dono?`<span class="selo publicado" title="${esc(dono.titulo)}">Em uso</span>`
      :`<span class="selo rascunho">Sem uso</span><button class="btn fantasma" data-apagar="${esc(f.nome)}" data-balde="capas" type="button">Apagar</button>`,
      dono?`Capa de ${dono.nome||dono.titulo}`:`${f.nome} · ${tamanho(f.bytes)}`);
  }).join('')}</div>`
    :`<div class="vazio" style="padding:24px 12px"><b>Nenhuma capa enviada</b>As capas atuais dos projetos estão na pasta imagens/ do site.</div>`;
}

async function recarregarGaleria(){
  const fotos=app.querySelector('#galeriaFotos');
  try{
    [midia.fotos,midia.capas]=await Promise.all([listarBalde(BALDE_FOTOS),listarBalde('capas')]);
  }catch(e){
    midia.fotos=[]; midia.capas=[];
    if(fotos) recado('Não foi possível listar as fotos: '+e.message,true);
  }
  pintarGaleria();
}

/* reduz, sobe para o balde de fotos e devolve o endereço público.
   Erro de envio vem marcado com "parar": os próximos arquivos falhariam igual. */
async function subirFoto(f,max){
  if(!/^image\/(png|jpeg|webp)$/.test(f.type)) throw new Error(`“${f.name}” não é PNG, JPG nem WebP.`);
  const pronta=await reduzirFoto(f,max);
  if(pronta.size>MAX_FOTO) throw new Error(`“${f.name}” passa de 5 MB mesmo reduzida.`);
  const ext=pronta.type==='image/jpeg'?'jpg':pronta.type==='image/webp'?'webp':'png';
  const nome=`${Date.now()}-${slug(f.name.replace(/\.[^.]+$/,''))||'foto'}.${ext}`;
  /* o nome nunca se repete, então o navegador pode guardar a foto por um ano */
  const {error}=await sb.storage.from(BALDE_FOTOS).upload(nome,pronta,
    {cacheControl:'31536000',contentType:pronta.type});
  if(error) throw Object.assign(new Error(faltaSqlFotos(error)
    ?'O espaço das fotos ainda não existe no banco. '+SQL_FOTOS
    :`Não foi possível enviar “${f.name}”: ${error.message}`),{parar:true});
  return sb.storage.from(BALDE_FOTOS).getPublicUrl(nome).data.publicUrl;
}

async function enviarFotos(arquivos,botao){
  botao.disabled=true;
  let enviadas=0;
  for(const [i,f] of arquivos.entries()){
    botao.textContent=`Enviando ${i+1} de ${arquivos.length}…`;
    try{await subirFoto(f);enviadas++;}
    catch(e){recado(e.message,true);if(e.parar) break;}
  }
  botao.disabled=false; botao.textContent='+ Enviar fotos';
  if(enviadas){
    await recarregarGaleria();
    recado(enviadas===1?'Foto enviada. Use “Pôr no carrossel” para levá-la ao site.'
      :`${enviadas} fotos enviadas. Use “Pôr no carrossel” para levá-las ao site.`);
  }
}

async function apagarArquivo(balde,nome){
  const url=sb.storage.from(balde).getPublicUrl(nome).data.publicUrl;
  if(noCarrossel(url)||noCarrosselPublicado(url))
    return recado('Esta foto está no carrossel. Tire-a de lá e salve antes de apagar.',true);
  const dono=PROJETOS.find(p=>p.capa===url);
  if(dono) return recado(`Esta imagem é a capa de “${dono.titulo}”. Troque a capa do projeto antes.`,true);
  const aviso=avisosSalvos().find(a=>a.imagem===url);
  if(aviso) return recado(`Esta foto é a imagem do aviso “${aviso.titulo}”. Troque ou tire a imagem do aviso antes.`,true);
  if(!confirm(`Apagar “${nome}” de vez? Não dá para desfazer.`)) return;
  const {data,error}=await sb.storage.from(balde).remove([nome]);
  if(error) return recado('Não foi possível apagar: '+error.message,true);
  /* sem permissão, o Supabase não dá erro: só não apaga nada */
  if(!data||!data.length) return recado('O banco não deixou apagar. '+SQL_FOTOS,true);
  recado('Arquivo apagado.');
  recarregarGaleria();
}

function ligarMidia(){
  midia.carrossel=(bloco('fotos',FOTOS_PADRAO).carrossel||[]).map(f=>({src:f.src,alt:f.alt||''}));
  pintarCarrossel();
  recarregarGaleria();

  const lista=app.querySelector('#listaCarrossel');
  lista.addEventListener('input',e=>{
    const l=e.target.closest('[data-i]');
    if(l&&e.target.matches('[data-alt]')){midia.carrossel[l.dataset.i].alt=e.target.value;edicao.sujo=true;}
  });
  lista.addEventListener('click',e=>{
    const l=e.target.closest('[data-i]'); if(!l) return;
    const i=Number(l.dataset.i), mover=e.target.closest('[data-mover]');
    if(mover){
      const j=i+Number(mover.dataset.mover);
      if(j<0||j>=midia.carrossel.length) return;
      [midia.carrossel[i],midia.carrossel[j]]=[midia.carrossel[j],midia.carrossel[i]];
    }else if(e.target.closest('[data-tirar]')) midia.carrossel.splice(i,1);
    else return;
    edicao.sujo=true; pintarCarrossel(); pintarGaleria();
  });

  /* ouvintes nos painéis, não no app: somem junto com a tela */
  const cliqueGaleria=e=>{
    const por=e.target.closest('[data-por]');
    if(por){
      midia.carrossel.push({src:por.dataset.por,alt:''});
      edicao.sujo=true; pintarCarrossel(); pintarGaleria();
      const nova=app.querySelector('#listaCarrossel').lastElementChild.querySelector('[data-alt]');
      nova.scrollIntoView({block:'center',behavior:'smooth'}); nova.focus({preventScroll:true});
      return recado('Foto no carrossel. Escreva a descrição e salve.');
    }
    const ap=e.target.closest('[data-apagar]');
    if(ap) apagarArquivo(ap.dataset.balde,ap.dataset.apagar);
  };
  app.querySelector('#galeriaFotos').addEventListener('click',cliqueGaleria);
  app.querySelector('#galeriaCapas').addEventListener('click',cliqueGaleria);

  const arquivo=app.querySelector('#arquivoFotos'), botao=app.querySelector('#enviarFotos');
  botao.onclick=()=>arquivo.click();
  arquivo.onchange=async()=>{
    const escolhidas=[...arquivo.files]; arquivo.value='';
    if(escolhidas.length) await enviarFotos(escolhidas,botao);
  };

  const salvar=app.querySelector('#salvarCarrossel');
  salvar.onclick=()=>{
    if(!midia.carrossel.length) return recado('O carrossel precisa de ao menos uma foto.',true);
    const sem=midia.carrossel.findIndex(f=>!f.alt.trim());
    if(sem>=0){
      app.querySelectorAll('#listaCarrossel [data-alt]')[sem].focus();
      return recado(`Falta a descrição da foto ${sem+1}. Ela é lida para quem usa leitor de tela.`,true);
    }
    salvarBloco('fotos',{carrossel:midia.carrossel.map(f=>({src:f.src,alt:f.alt.trim()}))},
      [salvar],'Carrossel publicado no site.');
  };
}

/* ---------- tela: quem tem acesso ----------
   Listar as contas exige ler auth.users, que o navegador não alcança. A
   função equipe() de dados/fotos-e-acesso.sql faz essa leitura do lado do
   banco e só responde para quem está logado. */
async function ligarEquipe(){
  const corpo=app.querySelector('#corpoEquipe');
  const [{data:{session}},{data,error}]=await Promise.all([sb.auth.getSession(),sb.rpc('equipe')]);
  const eu=session&&session.user&&session.user.email;
  const dataHora=d=>{const x=d?new Date(d):null;
    return x&&!isNaN(x)?x.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'nunca entrou';};
  if(error){
    const faltaSql=/equipe|schema cache|PGRST202|42883/i.test(`${error.code} ${error.message}`);
    corpo.innerHTML=`<tr><td colspan="3"><div class="vazio"><b>Não foi possível listar</b>${faltaSql
      ?'A lista depende de uma função no banco. '+esc(SQL_FOTOS):esc(error.message)}</div></td></tr>`;
  }else{
    corpo.innerHTML=(data||[]).map(p=>`<tr>
      <td><div class="item"><div class="avatar" style="background:var(--mata-claro);color:var(--folha);font-size:.8rem">${esc(String(p.email||'?').slice(0,2).toUpperCase())}</div>
        <div><b>${esc(p.email)}</b>${p.email===eu?'<small>você</small>':''}</div></div></td>
      <td style="font-family:var(--dado);font-size:.8rem;color:var(--texto-2)">${dataBR(p.criado_em)}</td>
      <td style="font-family:var(--dado);font-size:.8rem;color:var(--texto-2)">${dataHora(p.ultimo_acesso)}</td></tr>`).join('');
  }

  const botao=app.querySelector('#trocarSenha'); if(!botao) return;
  botao.onclick=async()=>{
    const a=app.querySelector('#novaSenha'), b=app.querySelector('#novaSenha2');
    if(a.value.length<8) return recado('A senha precisa de no mínimo 8 caracteres.',true);
    if(a.value!==b.value) return recado('As duas senhas não são iguais.',true);
    botao.disabled=true;
    const {error}=await sb.auth.updateUser({password:a.value});
    botao.disabled=false;
    if(error) return recado(/different|same/i.test(error.message)
      ?'A nova senha é igual à atual. Escolha outra.':'Não foi possível trocar a senha: '+error.message,true);
    a.value=''; b.value='';
    recado('Senha trocada. Use a nova no próximo acesso.');
  };
}

/* ---------- roteador ---------- */
let rotaAtual=location.hash||'#/';
function render(){
  const r=location.hash.replace(/^#/,'')||'/';
  rotaAtual=location.hash||'#/';
  if(r.startsWith('/projeto/')){
    app.innerHTML=formProjeto(decodeURIComponent(r.split('/')[2]||''));
    if(app.querySelector('#resultados')) ligarForm();
  }else if(r.startsWith('/aviso/')){
    app.innerHTML=formAviso(decodeURIComponent(r.split('/')[2]||''));
    if(app.querySelector('#formAviso')) ligarAviso();
  }else if(r.startsWith('/pagina/')){
    edicao={id:null,capa:'',sujo:false};
    app.innerHTML=formPagina(decodeURIComponent(r.split('/')[2]||''));
    if(app.querySelector('#formPagina')) ligarPagina();
  }else{
    edicao={id:null,capa:'',sujo:false};
    app.innerHTML=(paginas[r]||paginas['/'])();
    if(r==='/projetos') ligarLista();
    if(r==='/avisos')   ligarAvisos();
    if(r==='/numeros')  ligarNumeros();
    if(r==='/contato')  ligarContato();
    if(r==='/midia')    ligarMidia();
    if(r==='/equipe')   ligarEquipe();
  }
  document.querySelectorAll('aside nav a').forEach(a=>{
    const h=a.getAttribute('href').slice(1);
    a.classList.toggle('ativo', h===r || (r.startsWith('/projeto/')&&h==='/projetos')
      || (r.startsWith('/pagina/')&&h==='/paginas') || (r.startsWith('/aviso/')&&h==='/avisos'));
  });
  window.scrollTo(0,0);
}

/* trocar de tela pelo menu descartava o que estava sendo digitado sem avisar */
window.addEventListener('hashchange',()=>{
  if(edicao.sujo&&!confirm('Há alterações não salvas nesta tela. Sair mesmo assim?')){
    history.replaceState(null,'',rotaAtual);   /* volta o endereço sem redesenhar */
    return;
  }
  edicao.sujo=false;
  render();
});
window.addEventListener('beforeunload',e=>{if(edicao.sujo){e.preventDefault();e.returnValue='';}});
iniciar();
