<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do site — IDEPS</title>
<link rel="icon" href="ideps-icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* paleta extraída da logo do IDEPS */
  --papel:#F4F5FA; --branco:#FFF;
  --folha:#120A8B; --mata:#3A32A6; --mata-claro:#EAE9F6;
  --ipe:#D4007A; --ipe-claro:#FDE4F1;
  --amarelo:#F98A00; --amarelo-claro:#FFF1DC;
  --verde:#00C000; --agua:#00C87A; --laranja:#F98A00; --vermelho:#EE0000; --magenta:#F5008C;
  --linha:#DFE0EC; --texto:#161540; --texto-2:#585780;
  --display:'Bricolage Grotesque',sans-serif;
  --corpo:'Public Sans',system-ui,sans-serif;
  --dado:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--papel);color:var(--texto);font-family:var(--corpo);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--ipe);outline-offset:2px;border-radius:3px}
h1{font-family:var(--display);font-size:1.85rem;letter-spacing:-.02em;line-height:1.15}
h2{font-family:var(--display);font-size:1.15rem;font-weight:700;letter-spacing:-.01em}

.aviso{background:var(--folha);color:#CFE0D7;font-family:var(--dado);font-size:.7rem;
  letter-spacing:.06em;text-align:center;padding:6px 16px}

.faixa{display:flex;height:5px}
.faixa i{flex:1}
.app{display:grid;grid-template-columns:252px 1fr;min-height:calc(100vh - 26px)}

/* ---------- lateral ---------- */
aside{background:var(--folha);color:#C6C3EC;padding:24px 16px;display:flex;flex-direction:column;gap:26px}
.logo{display:flex;flex-direction:column;align-items:flex-start;gap:9px;padding:0 8px 6px}
/* o wordmark tem letras no mesmo azul do fundo: precisa de placa clara atrás */
.placa{background:var(--branco);border-radius:10px;padding:8px 11px;display:inline-flex}
.logo img{height:28px;display:block}
.logo b{font-family:var(--display);color:#fff;font-size:1.15rem;letter-spacing:-.02em}
.logo small{display:block;font-family:var(--dado);font-size:.62rem;letter-spacing:.11em;
  text-transform:uppercase;color:#948DD6;font-weight:400}
.grupo-titulo{font-family:var(--dado);font-size:.63rem;letter-spacing:.13em;text-transform:uppercase;
  color:#6D66C4;padding:0 10px;margin-bottom:8px}
aside nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;
  font-size:.94rem;font-weight:500;margin-bottom:2px;transition:background .12s}
aside nav a:hover{background:#2A2296;color:#fff}
aside nav a.ativo{background:var(--ipe);color:#fff}
aside nav a .conta{margin-left:auto;font-family:var(--dado);font-size:.72rem;opacity:.7}
.usuario{margin-top:auto;border-top:1px solid #3A32A6;padding-top:18px;display:flex;align-items:center;gap:11px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--mata);color:#fff;font-weight:700;
  display:grid;place-items:center;flex-shrink:0}
.usuario small{display:block;font-size:.76rem;color:#948DD6}

/* ---------- área principal ---------- */
main{padding:34px 40px 64px;overflow-x:auto}
.topo{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:30px;flex-wrap:wrap}
.topo p{color:var(--texto-2);margin-top:6px;max-width:62ch}
.btn{background:var(--ipe);color:#fff;padding:11px 19px;border-radius:99px;font-weight:700;font-size:.92rem;
  display:inline-flex;align-items:center;gap:8px;transition:background .12s}
.btn:hover{background:#AB0062}
.btn.linha{background:transparent;color:var(--folha);box-shadow:inset 0 0 0 1.5px var(--linha)}
.btn.linha:hover{background:var(--branco);box-shadow:inset 0 0 0 1.5px var(--folha)}
.btn.fantasma{background:transparent;color:var(--texto-2);padding:9px 12px}
.btn.fantasma:hover{background:var(--mata-claro);color:var(--folha)}

/* ---------- cartões e tabelas ---------- */
.painel{background:var(--branco);border:1px solid var(--linha);border-radius:14px;overflow:hidden}
.painel-cabeca{padding:18px 22px;border-bottom:1px solid var(--linha);display:flex;
  justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-family:var(--dado);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--texto-2);font-weight:500;padding:13px 22px;border-bottom:1px solid var(--linha)}
td{padding:15px 22px;border-bottom:1px solid var(--linha);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FAFBF9}
.item{display:flex;align-items:center;gap:13px}
.miniatura{width:42px;height:42px;border-radius:9px;background:var(--mata-claro);object-fit:contain;
  padding:4px;flex-shrink:0}
.item b{display:block;font-weight:500}
.item small{color:var(--texto-2);font-family:var(--dado);font-size:.74rem}
.selo{font-family:var(--dado);font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;
  padding:4px 9px;border-radius:5px;font-weight:500;white-space:nowrap}
.selo.publicado{background:var(--mata-claro);color:var(--folha)}
.selo.rascunho{background:var(--amarelo-claro);color:#8A4C00}
.selo.ativo{background:var(--ipe-claro);color:#A00060}
.acoes{display:flex;gap:4px;justify-content:flex-end}

/* ---------- resumo ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:30px}
.card{background:var(--branco);border:1px solid var(--linha);border-radius:14px;padding:20px}
.card strong{display:block;font-family:var(--display);font-size:2.1rem;line-height:1;letter-spacing:-.03em}
.card span{font-family:var(--dado);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--texto-2);display:block;margin-top:9px}
.card.alerta{border-color:var(--amarelo);background:var(--amarelo-claro)}
.card.alerta strong{color:#8A4C00}

/* ---------- formulário ---------- */
.form{display:grid;grid-template-columns:1fr 320px;gap:26px;align-items:start}
.campo{margin-bottom:20px}
label{display:block;font-weight:500;font-size:.9rem;margin-bottom:6px}
label small{display:block;font-weight:400;color:var(--texto-2);font-size:.82rem;margin-top:2px}
input[type=text],input[type=date],select,textarea{
  width:100%;padding:11px 13px;border:1.5px solid var(--linha);border-radius:9px;
  background:var(--branco);font-size:.95rem}
input:focus,select:focus,textarea:focus{border-color:var(--mata);outline:none}
textarea{min-height:120px;resize:vertical;line-height:1.6}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.caixa{background:var(--branco);border:1px solid var(--linha);border-radius:14px;padding:22px}
.caixa h2{margin-bottom:16px}
.dica{background:var(--mata-claro);border-radius:10px;padding:14px 16px;font-size:.87rem;
  color:var(--folha);margin-top:18px}
.dica b{display:block;margin-bottom:4px}
.contador{font-family:var(--dado);font-size:.74rem;color:var(--texto-2);text-align:right;margin-top:5px}
.repetidor{border:1.5px dashed var(--linha);border-radius:10px;padding:14px;margin-bottom:10px;
  display:flex;gap:10px;align-items:center}
.repetidor input{flex:1;border:none;padding:4px 0}
.rodape-form{display:flex;gap:10px;justify-content:flex-end;margin-top:26px;
  border-top:1px solid var(--linha);padding-top:22px}
.upload{border:1.5px dashed var(--linha);border-radius:12px;padding:28px;text-align:center;
  color:var(--texto-2);font-size:.9rem;background:#FAFBF9}
.upload b{display:block;color:var(--folha);margin-bottom:4px}

/* ---------- mídia ---------- */
.midia{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.midia figure{background:var(--branco);border:1px solid var(--linha);border-radius:12px;overflow:hidden}
.midia img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--mata-claro)}
.midia figcaption{padding:9px 11px;font-family:var(--dado);font-size:.7rem;color:var(--texto-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.vazio{padding:56px 22px;text-align:center;color:var(--texto-2)}
.vazio b{display:block;font-family:var(--display);font-size:1.15rem;color:var(--folha);margin-bottom:6px}

/* o atributo hidden precisa vencer o display:grid/flex dos blocos */
[hidden]{display:none!important}

/* ---------- tela de entrada ---------- */
.portao{position:fixed;inset:0;z-index:300;display:grid;place-items:center;
  background:var(--folha);padding:24px}
.portao-caixa{background:var(--branco);border-radius:16px;padding:34px;width:100%;max-width:400px;
  box-shadow:0 18px 50px rgba(0,0,0,.3)}
.portao-caixa img{height:30px;margin-bottom:22px}
.portao-caixa h1{font-size:1.5rem;margin-bottom:6px}
.portao-caixa p.abre{color:var(--texto-2);margin-bottom:22px;font-size:.92rem}
.portao-caixa .btn{width:100%;justify-content:center;margin-top:6px}
.erro{background:#FDE8E8;color:#A00000;border-radius:8px;padding:10px 13px;font-size:.86rem;margin-bottom:14px}
.sair{font-family:var(--dado);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;
  color:#948DD6;margin-left:auto;padding:6px 9px;border-radius:7px}
.sair:hover{background:#2A2296;color:#fff}

/* ---------- telas ainda não conectadas ---------- */
.maquete{background:var(--amarelo-claro);color:#8A4C00;border:1px solid var(--amarelo);
  border-radius:10px;padding:12px 16px;font-size:.88rem;margin-bottom:22px}
.maquete b{font-weight:700}

/* ---------- retorno de ação ---------- */
.recado{position:fixed;right:24px;bottom:24px;z-index:400;max-width:380px;
  background:var(--folha);color:#fff;padding:13px 18px;border-radius:10px;font-size:.9rem;
  box-shadow:0 8px 26px rgba(0,0,0,.24)}
.recado.ruim{background:#B00020}
.contador.estourou{color:#B00020;font-weight:700}

@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  aside{flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px;padding:14px}
  aside nav{display:flex;gap:4px;flex-wrap:wrap}
  .grupo-titulo,.usuario{display:none}
  .form{grid-template-columns:1fr}
  main{padding:24px 20px 48px}
}
</style>
</head>
<body>

<div class="portao" id="portao" hidden>
  <form class="portao-caixa" id="formLogin">
    <img src="ideps-wordmark.png" alt="IDEPS">
    <h1>Painel do site</h1>
    <p class="abre" id="portaoTexto">Entre com seu e-mail e senha para editar os projetos.</p>
    <p class="erro" id="erroLogin" hidden></p>
    <div id="camposLogin">
      <div class="campo"><label for="email">E-mail</label>
        <input id="email" type="text" autocomplete="username" required></div>
      <div class="campo"><label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit" id="btnEntrar">Entrar</button>
    </div>
  </form>
</div>

<div class="aviso" id="tarja">Projetos conectados ao banco. As demais telas ainda são demonstração.</div>

<div class="faixa"><i style="background:var(--vermelho)"></i><i style="background:var(--magenta)"></i><i style="background:var(--folha)"></i><i style="background:var(--agua)"></i><i style="background:var(--verde)"></i><i style="background:#F7E600"></i><i style="background:var(--laranja)"></i></div>
<div class="app" id="app-grade" hidden>
<aside>
  <div class="logo">
    <span class="placa"><img src="ideps-wordmark.png" alt="IDEPS"></span>
    <small>Painel do site</small>
  </div>
  <div>
    <p class="grupo-titulo">Conteúdo</p>
    <nav id="nav">
      <a href="#/">Resumo</a>
      <a href="#/projetos">Projetos <span class="conta" id="contaProjetos"></span></a>
      <a href="#/paginas">Páginas</a>
      <a href="#/transparencia">Transparência</a>
      <a href="#/numeros">Números do topo</a>
      <a href="#/midia">Fotos e arquivos</a>
    </nav>
  </div>
  <div>
    <p class="grupo-titulo">Configurações</p>
    <nav id="nav2">
      <a href="#/contato">Contato e rodapé</a>
      <a href="#/equipe">Quem tem acesso</a>
    </nav>
  </div>
  <div class="usuario">
    <div class="avatar" id="avatar">··</div>
    <div><b style="font-size:.9rem;color:#fff" id="usuarioNome">—</b><small id="usuarioEmail"></small></div>
    <button class="sair" id="btnSair">Sair</button>
  </div>
</aside>

<main id="app"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ============================================================
   Painel do IDEPS
   Nesta etapa só a área de Projetos grava de verdade; as demais
   telas seguem como demonstração e estão marcadas como tal.

   Configuração: Supabase → Project Settings → API.
   A chave "anon" é pública por natureza — quem protege o banco são
   as regras de RLS de dados/supabase.sql. Nunca use aqui a chave
   service_role, que ignora todas as regras.
   ============================================================ */
const SUPABASE_URL='https://asyqrlmdeptztggapdnn.supabase.co';
const SUPABASE_ANON='sb_publishable_2MwWorspfb9vupsGpmsGyw_qKz9IG-N';

const IMG='imagens/';
/* aceita a URL colada com barra no fim ou já com /rest/v1 junto:
   o SDK monta os caminhos sozinho a partir da Project URL */
const BASE=SUPABASE_URL.trim().replace(/\/+$/,'').replace(/\/rest\/v1$/,'');
const sb=(BASE&&SUPABASE_ANON&&window.supabase)
  ? window.supabase.createClient(BASE,SUPABASE_ANON) : null;

const app=document.getElementById('app');
const grade=document.getElementById('app-grade');
const portao=document.getElementById('portao');

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* usado na busca: "seguranca" precisa encontrar "Segurança" */
const semAcento=s=>String(s||'').normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase();
/* usado no endereço do projeto — o corte de 60 vale só aqui */
const slug=s=>semAcento(s).replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'').slice(0,60);
const dataBR=d=>{const x=d?new Date(d):null;return x&&!isNaN(x)?x.toLocaleDateString('pt-BR'):'—'};
const soData=d=>d?String(d).slice(0,10):'';
const saudacao=()=>{const h=new Date().getHours();return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'};

const EIXOS=['Direitos e cidadania','Pessoas idosas','Mulheres',
 'Segurança alimentar','Saúde e convivência','Juventude'];
const CORES={'Direitos e cidadania':'var(--folha)','Pessoas idosas':'var(--laranja)',
 'Mulheres':'var(--magenta)','Segurança alimentar':'var(--verde)',
 'Saúde e convivência':'var(--agua)','Juventude':'var(--vermelho)'};
const ponto=e=>`<span style="display:inline-block;width:11px;height:11px;border-radius:50%;
 background:${CORES[e]||'var(--folha)'};margin-right:9px;vertical-align:-1px"></span>`;
const selo=pub=>`<span class="selo ${pub?'publicado':'rascunho'}">${pub?'Publicado':'Rascunho'}</span>`;
const maquete=`<div class="maquete"><b>Tela de demonstração.</b> Esta parte ainda não está ligada ao
 banco: o que você editar aqui não é salvo. Por enquanto só a área de Projetos grava.</div>`;

let PROJETOS=[];
let usuario='';
let edicao={id:null,capa:'',sujo:false};

/* ---------- retorno de ação ---------- */
let recadoTimer=null;
function recado(msg,ruim){
  document.querySelectorAll('.recado').forEach(n=>n.remove());
  const d=document.createElement('div');
  d.className='recado'+(ruim?' ruim':'');
  d.setAttribute('role','status');
  d.textContent=msg;
  document.body.appendChild(d);
  clearTimeout(recadoTimer);
  recadoTimer=setTimeout(()=>d.remove(),ruim?8000:3500);
}

/* ---------- entrada ---------- */
async function iniciar(){
  if(!sb) return portaoSemConfig();
  const {data:{session}}=await sb.auth.getSession();
  if(session) await abrirPainel(session); else mostrarPortao();
  sb.auth.onAuthStateChange((_ev,s)=>{if(!s){PROJETOS=[];mostrarPortao();}});
}

function portaoSemConfig(){
  portao.hidden=false; grade.hidden=true;
  document.getElementById('camposLogin').hidden=true;
  document.getElementById('portaoTexto').innerHTML=
    'Falta ligar o banco de dados. Rode <b>dados/supabase.sql</b> no SQL Editor do Supabase, '+
    'crie seu usuário em Authentication → Users e preencha <b>SUPABASE_URL</b> e '+
    '<b>SUPABASE_ANON</b> no topo do script deste arquivo e do index.html.';
}

function mostrarPortao(){portao.hidden=false;grade.hidden=true;}

async function abrirPainel(session){
  const email=session.user.email||'';
  usuario=email.split('@')[0];
  document.getElementById('usuarioEmail').textContent=email;
  document.getElementById('usuarioNome').textContent=usuario;
  document.getElementById('avatar').textContent=email.slice(0,2).toUpperCase();
  portao.hidden=true; grade.hidden=false;
  await carregar();
  render();
}

document.getElementById('formLogin').onsubmit=async e=>{
  e.preventDefault();
  if(!sb) return;
  const erro=document.getElementById('erroLogin'), btn=document.getElementById('btnEntrar');
  erro.hidden=true; btn.disabled=true; btn.textContent='Entrando…';
  const {data,error}=await sb.auth.signInWithPassword({
    email:document.getElementById('email').value.trim(),
    password:document.getElementById('senha').value});
  btn.disabled=false; btn.textContent='Entrar';
  if(error){
    erro.textContent='Não foi possível entrar. Confira e-mail e senha.';
    erro.hidden=false; return;
  }
  document.getElementById('senha').value='';
  abrirPainel(data.session);
};

document.getElementById('btnSair').onclick=async()=>{
  if(edicao.sujo&&!confirm('Há alterações não salvas. Sair mesmo assim?')) return;
  edicao.sujo=false;
  await sb.auth.signOut();
  PROJETOS=[];
  location.hash='#/';
  mostrarPortao();   /* não depender só do onAuthStateChange para fechar o painel */
};

/* ---------- dados ---------- */
async function carregar(){
  const {data,error}=await sb.from('projetos').select('*')
    .order('atualizado_em',{ascending:false});
  if(error){recado('Não foi possível carregar os projetos: '+error.message,true);return;}
  PROJETOS=data||[];
  document.getElementById('contaProjetos').textContent=PROJETOS.length;
}

/* ---------- telas ---------- */
const linhaProjeto=p=>`<tr>
  <td><div class="item"><img class="miniatura" src="${esc(p.capa)}" alt="">
    <div><b>${esc(p.titulo)}</b><small>${esc(p.termo||'sem termo de fomento')}</small></div></div></td>
  <td style="color:var(--texto-2)">${ponto(p.eixo)}${esc(p.eixo)}</td>
  <td><span class="selo ${p.status==='ativo'?'ativo':'publicado'}">${p.status==='ativo'?'Em andamento':'Finalizado'}</span></td>
  <td>${selo(p.publicado)}</td>
  <td style="font-family:var(--dado);font-size:.8rem;color:var(--texto-2)">${dataBR(p.atualizado_em)}</td>
  <td class="acoes"><a class="btn fantasma" href="#/projeto/${encodeURIComponent(p.id)}">Editar</a></td></tr>`;

const linhasProjetos=l=>l.length?l.map(linhaProjeto).join('')
  :`<tr><td colspan="6"><div class="vazio"><b>Nada encontrado</b>Ajuste a busca ou o filtro acima.</div></td></tr>`;

const pendencias=p=>{
  const f=[];
  if(!p.publicado) f.push('está como rascunho');
  if(!p.inicio||!p.fim) f.push('faltam as datas do termo');
  if(!p.valor) f.push('falta o valor do investimento');
  if(!p.publico) f.push('falta o público atendido');
  if(!p.resumo) f.push('falta o resumo');
  return f;
};

const paginas={

'/':()=>{
  const publicados=PROJETOS.filter(p=>p.publicado);
  const rascunhos=PROJETOS.filter(p=>!p.publicado);
  const ativos=PROJETOS.filter(p=>p.status==='ativo');
  const atencao=PROJETOS.map(p=>[p,pendencias(p)]).filter(([,f])=>f.length);
  return `
 <div class="topo">
   <div><h1>${saudacao()}${usuario?', '+esc(usuario):''}</h1>
     <p>Um resumo do que está no ar e do que precisa da sua atenção.</p></div>
   <a class="btn" href="#/projeto/novo">+ Novo projeto</a>
 </div>
 <div class="cards">
   <div class="card"><strong style="color:var(--folha)">${publicados.length}</strong><span>projetos publicados</span></div>
   <div class="card"><strong style="color:var(--magenta)">${ativos.length}</strong><span>em andamento</span></div>
   <div class="card ${rascunhos.length?'alerta':''}"><strong ${rascunhos.length?'':'style="color:var(--verde)"'}>${rascunhos.length}</strong>
     <span>${rascunhos.length===1?'rascunho parado':'rascunhos parados'}</span></div>

function lerForm(){
  const v=n=>{const el=app.querySelector(`[data-campo="${n}"]`);return el?el.value.trim():''};
  return {
    titulo:v('titulo'), nome:v('nome'), resumo:v('resumo'), objeto:v('objeto'), texto:v('texto'),
    eixo:v('eixo'), status:v('status'), termo:v('termo'), periodo:v('periodo'),
    valor:v('valor'), publico:v('publico'),
    inicio:v('inicio')||null, fim:v('fim')||null,
    capa:edicao.capa||null,
    resultados:[...app.querySelectorAll('[data-resultado]')].map(i=>i.value.trim()).filter(Boolean)
  };
}

function validar(d){
  if(!d.titulo) return 'O nome do projeto é obrigatório.';
  if(!d.nome) return 'O nome curto é obrigatório: é ele que aparece na linha do tempo.';
  if(d.nome.length>28) return 'O nome curto passa de 28 caracteres.';
  if(!EIXOS.includes(d.eixo)) return 'Escolha uma área de atuação.';
  if(!d.inicio||!d.fim) return 'Informe início e fim previsto: são eles que posicionam a barra na linha do tempo.';
  if(d.fim<d.inicio) return 'O fim previsto é anterior ao início.';
  return '';
}

function travar(sim){
  app.querySelectorAll('#salvarTopo,#salvarRascunho,#publicar,#descartar')
    .forEach(b=>b.disabled=sim);
}

async function salvar(publicado){
  const d=lerForm();
  const problema=validar(d);
  if(problema) return recado(problema,true);
  const id=edicao.id||slug(d.nome||d.titulo);
  if(!id) return recado('Não consegui gerar um endereço a partir desse nome.',true);
  if(!edicao.id&&PROJETOS.some(x=>x.id===id))
    return recado('Já existe um projeto no endereço "'+id+'". Mude o nome curto.',true);

  travar(true);
  const {error}=await sb.from('projetos').upsert({id,publicado,...d});
  travar(false);
  if(error) return recado('Não foi possível salvar: '+error.message,true);

  const eraNovo=!edicao.id;
  edicao.sujo=false;
  await carregar();
  recado(publicado?'Publicado no site.':'Salvo como rascunho.');
  if(eraNovo) location.hash='#/projeto/'+encodeURIComponent(id); else render();
}

async function enviarCapa(arquivo){
  const ext=(arquivo.name.split('.').pop()||'png').toLowerCase();
  const base=slug(arquivo.name.replace(/\.[^.]+$/,''))||'capa';
  const caminho=`${Date.now()}-${base}.${ext}`;
  const {error}=await sb.storage.from('capas').upload(caminho,arquivo,{cacheControl:'3600'});
  if(error) throw error;
  return sb.storage.from('capas').getPublicUrl(caminho).data.publicUrl;
}

function ligarForm(){
  app.querySelectorAll('input,textarea,select').forEach(el=>
    el.addEventListener('input',()=>{edicao.sujo=true;contadores();}));
  contadores();

  const caixa=app.querySelector('#resultados');
  app.querySelector('#addResultado').onclick=()=>{
    caixa.insertAdjacentHTML('beforeend',linhaResultado(''));
    const novo=caixa.lastElementChild.querySelector('input');
    novo.addEventListener('input',()=>{edicao.sujo=true});
    novo.focus(); edicao.sujo=true;
  };
  caixa.onclick=e=>{
    const b=e.target.closest('[data-remover]'); if(!b) return;
    if(caixa.children.length>1) b.parentElement.remove();
    else b.parentElement.querySelector('input').value='';
    edicao.sujo=true;
  };

  const arquivo=app.querySelector('#arquivoCapa');
  const btnCapa=app.querySelector('#btnCapa');
  const abrir=()=>arquivo.click();
  btnCapa.onclick=abrir;
  app.querySelector('#areaCapa').onclick=abrir;
  arquivo.onchange=async()=>{
    const f=arquivo.files[0]; if(!f) return;
    if(f.size>5*1024*1024){arquivo.value='';return recado('Imagem maior que 5 MB. Reduza antes de enviar.',true);}
    btnCapa.disabled=true; btnCapa.textContent='Enviando…';
    try{
      const url=await enviarCapa(f);
      edicao.capa=url; edicao.sujo=true;
      const previa=app.querySelector('#previaCapa');
      previa.src=url; previa.hidden=false;
      app.querySelector('#areaCapa').hidden=true;
      btnCapa.textContent='Trocar imagem';
      recado('Imagem enviada. Salve o projeto para valer.');
    }catch(e){
      recado('Não foi possível enviar a imagem: '+e.message,true);
      btnCapa.textContent=edicao.capa?'Trocar imagem':'Escolher imagem';
    }
    btnCapa.disabled=false; arquivo.value='';
  };

  app.querySelector('#salvarTopo').onclick=()=>{
    const atual=edicao.id?(PROJETOS.find(x=>x.id===edicao.id)||{}).publicado:true;
    salvar(!!atual);
  };
  app.querySelector('#salvarRascunho').onclick=()=>salvar(false);
  app.querySelector('#publicar').onclick=()=>salvar(true);
  app.querySelector('#descartar').onclick=()=>{
    if(edicao.sujo&&!confirm('Descartar as alterações não salvas?')) return;
    edicao.sujo=false; location.hash='#/projetos';
  };
  app.querySelector('#verSite').onclick=()=>{
    if(!edicao.id) return recado('Salve o projeto primeiro para poder vê-lo no site.',true);
    const p=PROJETOS.find(x=>x.id===edicao.id);
    if(p&&!p.publicado) recado('Este projeto está como rascunho: o site vai dizer que não encontrou.');
    window.open('index.html#/projeto/'+encodeURIComponent(edicao.id),'_blank','noopener');
  };
}

function contadores(){
  app.querySelectorAll('[data-contador]').forEach(c=>{
    const campo=app.querySelector(`[data-campo="${c.dataset.contador}"]`);
    if(!campo) return;
    const max=Number(campo.getAttribute('maxlength'))||0;
    c.textContent=`${campo.value.length} / ${max}`;
    c.classList.toggle('estourou',max&&campo.value.length>=max);
  });
}

/* ---------- lista de projetos ---------- */
function ligarLista(){
  const busca=app.querySelector('#busca'), situacao=app.querySelector('#situacao'),
        corpo=app.querySelector('#corpoProjetos'), conta=app.querySelector('#contaLista');
  const aplicar=()=>{
    const termo=semAcento(busca.value).trim();
    const s=situacao.value;
    const lista=PROJETOS.filter(p=>{
      const acha=!termo||semAcento(`${p.titulo} ${p.nome} ${p.termo||''} ${p.eixo}`).includes(termo);
      const bate=!s||(s==='rascunho'?!p.publicado:p.status===s);
      return acha&&bate;
    });
    corpo.innerHTML=linhasProjetos(lista);
    conta.textContent=lista.length===PROJETOS.length
      ? `${PROJETOS.length} projetos`
      : `${lista.length} de ${PROJETOS.length} projetos`;
  };
  busca.oninput=aplicar;
  situacao.onchange=aplicar;
}

/* ---------- roteador ---------- */
function render(){
  const r=location.hash.replace(/^#/,'')||'/';
  if(r.startsWith('/projeto/')){
    app.innerHTML=formProjeto(decodeURIComponent(r.split('/')[2]||''));
    if(app.querySelector('#resultados')) ligarForm();
  }else{
    edicao={id:null,capa:'',sujo:false};
    app.innerHTML=(paginas[r]||paginas['/'])();
    if(r==='/projetos') ligarLista();
  }
  document.querySelectorAll('aside nav a').forEach(a=>{
    const h=a.getAttribute('href').slice(1);
    a.classList.toggle('ativo', h===r || (r.startsWith('/projeto/')&&h==='/projetos'));
  });
  window.scrollTo(0,0);
}

window.addEventListener('hashchange',render);
window.addEventListener('beforeunload',e=>{if(edicao.sujo){e.preventDefault();e.returnValue='';}});
iniciar();
</script>
</body>
</html>
